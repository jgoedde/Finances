server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # Backups: the app PUTs the database file here. Mount a host directory
    # (writable by the nginx user, uid 101) at /backups to keep them.
    # Write-only on purpose, so backups can't be read back over the network.
    location ~ ^/backups/[\w.-]+\.db$ {
        root /;
        dav_methods PUT;
        dav_access user:rw group:r all:r;
        client_max_body_size 100m;
        limit_except PUT {
            deny all;
        }
    }

    # Service worker & its registration script: never cache, always revalidate
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }
    location = /registerSW.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    # Workbox's own manifest/precache metadata
    location ~* /workbox-.*\.js$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    # index.html must always be revalidated too — it's the entry point
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    # Hashed build assets (js/css with content hash in filename) — cache hard
    location ~* \.(?:js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Icons/manifest — safe to cache moderately
    location ~* \.(?:png|ico|webmanifest|svg)$ {
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
