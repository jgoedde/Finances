name: Analyze with Knip
on:
    push:
        branches:
            - main
    pull_request:

jobs:
    knip:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc

            - name: Install dependencies
              run: npm install

            - name: Run Knip analysis
              run: npm run knip:check
