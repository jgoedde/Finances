name: Check Build

on:
    push:
        branches:
            - main
    pull_request:

jobs:
    check-build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v3

            - name: Read .nvmrc
              run: echo "##[set-output name=NVMRC;]$(cat .nvmrc)"
              id: nvm

            - name: Set up Node.js
              uses: actions/setup-node@v3
              with:
                  node-version: "${{ steps.nvm.outputs.NVMRC }}"

            - name: Install dependencies
              run: npm install

            - name: Run build check
              run: npm run build
