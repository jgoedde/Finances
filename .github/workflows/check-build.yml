name: Check Build

on:
    push:
        branches:
            - main
    pull_request:

jobs:
    check-build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v3

            - run: nvmrc=$(cat .nvmrc)

            - name: Set up Node.js
              uses: actions/setup-node@v3
              with:
                  node-version: $nvmrc

            - name: Install dependencies
              run: npm install

            - name: Run build check
              run: npm run build
