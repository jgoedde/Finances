name: Bump version

# Opens a version bump PR and lets it auto-merge once CI passes; tag-release.yml then tags the merge commit.
# Uses RELEASE_TOKEN (fine-grained PAT: Contents and Pull requests read/write) because anything done with
# GITHUB_TOKEN triggers no workflows, so the PR would never get its required checks.
on:
    workflow_dispatch:
        inputs:
            bump:
                description: Version bump
                type: choice
                options: [patch, minor]
                default: patch

jobs:
    bump:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        env:
            GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        steps:
            - name: Require main
              if: github.ref != 'refs/heads/main'
              run: |
                  echo "::error::Dispatch this workflow from main."
                  exit 1

            - uses: actions/checkout@v7
              with:
                  token: ${{ secrets.RELEASE_TOKEN }}
                  # Tags and history for the changelog in the PR body.
                  fetch-depth: 0

            - name: Fail if a bump PR is open
              run: |
                  open=$(gh pr list --state open --json headRefName,url \
                      --jq '[.[] | select(.headRefName | startswith("release/"))][0].url // empty')
                  if [ -n "$open" ]; then
                      echo "::error::A version bump PR is already open: $open"
                      exit 1
                  fi

            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc

            - name: Bump version
              env:
                  BUMP: ${{ inputs.bump }}
              run: |
                  version=$(npm version "$BUMP" --no-git-tag-version --ignore-scripts)
                  branch="release/$version"
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git switch -c "$branch"
                  git commit -am "chore: $version"
                  git push origin "$branch"

                  {
                      echo "Changes since $(git describe --tags --abbrev=0 HEAD~1):"
                      echo
                      git log --format='- %s' "$(git describe --tags --abbrev=0 HEAD~1)..HEAD~1"
                  } > pr-body.md
                  gh pr create --base main --head "$branch" --title "chore: $version" --body-file pr-body.md
                  gh pr merge "$branch" --auto --squash
