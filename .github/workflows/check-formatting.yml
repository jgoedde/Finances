name: Check code format
on:
    push:
        branches:
            - main
    pull_request:

jobs:
    check-formatting:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc

            - name: Install dependencies
              run: npm install

            - name: Check code formatting
              run: npm run format:check
