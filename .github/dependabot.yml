version: 2

updates:
    - package-ecosystem: "npm"
      directory: "/"
      schedule:
          interval: "weekly"
      assignees:
          - "jgoedde"
      groups:
          minor-and-patch:
              applies-to: version-updates
              patterns:
                  - "*"
              update-types:
                  - "minor"
                  - "patch"

    - package-ecosystem: "github-actions"
      directory: "/"
      assignees:
          - "jgoedde"
      schedule:
          interval: "weekly"
