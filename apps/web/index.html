<!doctype html>
<html lang="de">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content, viewport-fit=cover"
        />
        <title>Finances</title>
        <meta
            name="description"
            content="Keep track of your personal finances."
        />
        <meta name="color-scheme" content="light dark" />
        <!-- MD3 surface, the color of the unscrolled top app bar. -->
        <meta
            name="theme-color"
            content="#FAF8FF"
            media="(prefers-color-scheme: light)"
        />
        <meta
            name="theme-color"
            content="#121318"
            media="(prefers-color-scheme: dark)"
        />
        <meta name="apple-mobile-web-app-title" content="Finances" />
        <link
            rel="apple-touch-icon"
            sizes="180x180"
            href="/apple-touch-icon.png"
        />
        <link
            rel="icon"
            type="image/png"
            sizes="32x32"
            href="/favicon-32x32.png"
        />
        <link
            rel="icon"
            type="image/png"
            sizes="16x16"
            href="/favicon-16x16.png"
        />
        <link rel="manifest" href="/site.webmanifest" />
    </head>
    <body class="bg-surface text-on-surface">
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
